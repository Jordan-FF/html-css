<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou siplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture><!-- O 'source' precisa estar em ordem para poder funcionar normalmente, ficar coeso-->
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir aúdios em HTML5.</p>
    <audio preload="auto" controls loop autoplay>
        <source src="midia/AC_DC-Thunderstruck.mp3" type="audio/mpeg">
        <source src="midia/AC_DC-Thunderstruck.ogg" type="audio/ogg">
        <source src="midia/AC_DC-Thunderstruck.wav" type="audio/wav">
        <p>Infelizmente seu navegador não possui suporte para aúdios. <a href="midia/AC_DC-Thunderstruck.mp3">Clique aqui para baixar</a></p>
    </audio>
</body>
</html>
